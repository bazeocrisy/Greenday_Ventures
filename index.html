<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Greenday Venture website">
    <title>Greenday Venture</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem;
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            text-align: center;
            background: #173d2b;
        }

        main {
            width: min(700px, 100%);
        }

        h1 {
            margin-bottom: 1rem;
            font-size: clamp(2.5rem, 7vw, 5rem);
        }

        p {
            font-size: 1.15rem;
            line-height: 1.7;
        }

</head>

<body>
    <main>
        <h1>Greenday Venture</h1>

        <p>
            A new website is currently being developed for Greenday Venture.
        </p>

</html>
